<section class="min-h-[80vh] flex items-center justify-center bg-gray-100 px-4 py-10">

  <div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-6 sm:p-8">

    <!-- Title -->
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
      <p class="text-gray-500 text-sm">Login to your account</p>
    </div>

    <!-- FORM -->
    <form class="space-y-5">

      <!-- Email -->
      <div>
        <label class="text-sm font-medium text-gray-700">Email</label>
        <div class="flex items-center border rounded-lg px-3 mt-1 focus-within:ring-2 focus-within:ring-indigo-500">
          <i class="fa fa-envelope text-gray-400 text-sm"></i>
          <input type="email" placeholder="Enter your email"
            class="w-full p-2 outline-none text-sm bg-transparent">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="text-sm font-medium text-gray-700">Password</label>
        <div class="flex items-center border rounded-lg px-3 mt-1 focus-within:ring-2 focus-within:ring-indigo-500">
          <i class="fa fa-lock text-gray-400 text-sm"></i>

          <input id="password" type="password" placeholder="Enter your password"
            class="w-full p-2 outline-none text-sm bg-transparent">

          <button type="button" onclick="togglePassword()">
            <i class="fa fa-eye text-gray-400 text-sm" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Options -->
      <div class="flex items-center justify-between text-sm">
        <span></span>
        <a href="forgot-password.html" class="text-indigo-600 hover:underline">
          Forgot password?
        </a>
      </div>

      <!-- Button -->
      <button type="submit"  style="background-color:#0B6D20;"
        class="w-full text-white py-3 rounded-xl hover:bg-indigo-700 transition font-semibold">
        Login
      </button>

    </form>

  </div>

</section>

<script>
function togglePassword() {
  const password = document.getElementById("password");
  const icon = document.getElementById("eyeIcon");

  if (password.type === "password") {
    password.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    password.type = "password";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}

$(document).ready(function(){
    $("button").click(function(){
      $(this).addClass("scale-95");
      setTimeout(() => {
        $(this).removeClass("scale-95");
      }, 150);
    });
  });

  document.getElementById("menuBtn").addEventListener("click", function() {
    let menu = document.getElementById("mobileMenu");
    menu.classList.toggle("hidden");
  });
</script>
