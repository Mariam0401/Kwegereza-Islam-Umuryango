    <!-- Preset Amounts -->
    <!-- <div class="grid grid-cols-3 gap-3 mb-5">

      <button class="amount-btn border rounded-lg py-2 hover:bg-indigo-600 hover:text-white">10,000 RWF</button>

<script>

$(document).ready(function(){
    $("button").click(function(){
      $(this).addClass("scale-95");
      setTimeout(() => {
        $(this).removeClass("scale-95");
      }, 150);
    });
  });

  document.getElementById("menuBtn").addEventListener("click", function() {
    let menu = document.getElementById("mobileMenu");
    menu.classList.toggle("hidden");
  });

const buttons = document.querySelectorAll(".amount-btn");
const input = document.getElementById("customAmount");

buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("bg-indigo-600","text-white"));
    btn.classList.add("bg-indigo-600","text-white");

    let value = btn.innerText.replace(/[^0-9]/g, '');
    if (value) input.value = value;
    if (btn.innerText === "Other") input.focus();
  });
});

const openBtn = document.getElementById("openSearch");
const modal = document.getElementById("searchModal");
const closeBtn = document.getElementById("closeSearch");

openBtn.onclick = () => {
  modal.classList.remove("hidden");
  modal.classList.add("flex");
};

closeBtn.onclick = () => {
  modal.classList.add("hidden");
  modal.classList.remove("flex");
};

// Close when clicking outside
modal.addEventListener("click", (e) => {
  if (e.target === modal) {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  }
});
</script>
